version: 2

# Exposures = the things OUTSIDE dbt that use our models (dashboards, reports, ML models).
# They appear at the end of the lineage graph: impact analysis starts here.
exposures:
  - name: sales_dashboard
    label: Sales dashboard (Metabase)
    type: dashboard
    maturity: high
    owner:
      name: Sara Martin
      email: sara.martin@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Daily revenue, orders and conversion per channel. Opened every morning by the CEO."

  - name: finance_monthly_revenue_report
    label: Finance monthly revenue report
    type: analysis
    maturity: high
    owner:
      name: Paul Girard
      email: paul.girard@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Monthly net revenue (excluding VAT, after refunds) and active customers for the board report and the annual accounts. Closed on the 3rd working day of each month."

  - name: churn_prediction_model
    label: Churn prediction model (ML)
    type: ml
    maturity: medium
    owner:
      name: Karim Benali
      email: karim.benali@shopfast.example
    depends_on:
      - ref('dim_customers')
    description: "Weekly scoring of each customer's probability to churn (no order in the next 12 months). Features: lifetime_orders, last_order_date, lifetime_net_revenue_eur, loyalty_tier. Scores feed the retention campaigns of Marketing."
